[package]
name = "cross-chain-verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Pinned to the version already present in Cargo.lock (as `soroban-sdk`
# pulls it in transitively) so `--locked` builds stay reproducible.
ed25519-dalek = "=2.1.1"
